<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}{{ site_name }}{% endblock %}</title><meta name="description" content="{% block description %}A curated collection of playful dogs and everyday moments with their owners.{% endblock %}">{% if canonical %}<link rel="canonical" href="{{ canonical }}">{% endif %}<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">{% block meta %}{% endblock %}</head><body><header><a class="brand" href="/">{{ site_name }} <span>●</span></a><span class="tagline">Good dogs. Happy moments.</span></header><main>{% block body %}{% endblock %}</main><footer>A little more joy, one photo at a time.</footer></body></html>
