{% extends 'base.html' %}{% block body %}<a class="back" href="/admin">← All source images</a><h1>Select a photo</h1><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><div class="grid">{% for key in keys %}<label class="card choice"><input required type="radio" name="object_key" value="{{ key }}" {% if selected and selected.object_key==key %}checked{% endif %}><img src="{{ asset_url(key) }}" alt="Frame {{ loop.index }}" loading="lazy"><span>Frame {{ loop.index }}</span></label>{% else %}<p>No supported image links were found in this index.</p>{% endfor %}</div><div class="fields"><label>Photo title<input name="title" maxlength="160" required value="{{ selected.title if selected else '' }}"></label><label>Caption<textarea name="caption" maxlength="2000" rows="4">{{ selected.caption if selected else '' }}</textarea></label><label class="confirm"><input type="checkbox" name="reviewed" value="yes" required> I reviewed this photo: it is nonsexual, suitable for the public collection, and I have permission to publish it.</label><button>Publish selected photo</button></div></form>{% if selected %}<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><input type="hidden" name="action" value="remove"><button class="secondary">Remove from public collection</button></form>{% endif %}{% endblock %}
